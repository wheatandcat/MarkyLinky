<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>MarkyLinky に登録中...</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1>MarkyLinky に登録</h1>

    <div id="unsupported" class="card warning" hidden>
      <p>
        <strong>このページは Android の Chrome でのみ利用できます。</strong>
      </p>
      <p>
        Brave など Chrome 以外のブラウザや、Android 以外の端末では
        この機能は動作しません。Android 端末の <strong>Chrome</strong>
        でアプリをインストールし直してください。
      </p>
    </div>

    <div id="notInstalled" class="card warning" hidden>
      <p><strong>まずアプリをインストールしてください。</strong></p>
      <p>
        ブラウザのタブで開いたままでは利用できません。「アプリをインストール」でホーム画面に追加し、追加されたアイコンから起動し直してください。
      </p>
      <button id="installApp" type="button" hidden>アプリをインストール</button>
      <p id="installStatus" class="status"></p>
    </div>

    <div id="main" class="card" hidden>
      <p id="status">登録しています...</p>
      <div id="result"></div>
      <p><a href="/">設定に戻る</a></p>
    </div>

    <script type="module" src="/src/share.ts"></script>
  </body>
</html>
